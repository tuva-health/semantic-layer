name: Semantic Layer CI

on:
  pull_request:
    paths:
      - 'dbt_project.yml'
      - 'packages.yml'
      - 'README.md'
      - 'LICENSE.txt'
      - 'license/**'
      - 'integration_tests/**'
      - 'macros/load_semantic_layer_seed.sql'
      - 'models/**'
      - 'seeds/**'
      - 'tests/**'
      - 'scripts/test_package_contract.py'
      - '.github/workflows/package-contract.yml'
      - '.github/workflows/create-release.yml'
      - '.github/profiles/profiles.yml'
  push:
    branches:
      - main
    paths:
      - 'dbt_project.yml'
      - 'packages.yml'
      - 'README.md'
      - 'LICENSE.txt'
      - 'license/**'
      - 'integration_tests/**'
      - 'macros/load_semantic_layer_seed.sql'
      - 'models/**'
      - 'seeds/**'
      - 'tests/**'
      - 'scripts/test_package_contract.py'
      - '.github/workflows/package-contract.yml'
      - '.github/workflows/create-release.yml'
      - '.github/profiles/profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DBT_CORE_VERSION: "1.11.14"
  DBT_DUCKDB_VERSION: "1.10.1"
  DBT_PROFILES_DIR: ${{ github.workspace }}/.github/profiles
  TUVA_DBT_PROFILE: default

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify package contract
        run: python3 scripts/test_package_contract.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dbt with DuckDB
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "dbt-core==${DBT_CORE_VERSION}" \
            "dbt-duckdb==${DBT_DUCKDB_VERSION}"
          python -m pip check
          dbt --version

      - name: Resolve immutable dependencies
        run: scripts/dbt-local deps

      - name: Build the Semantic Layer dependency graph
        run: >-
          scripts/dbt-local build --full-refresh --indirect-selection cautious
          --select +package:semantic_layer
