version: 2

models:
  - name: semantic_layer__dim_data_source
    description: One row per data source represented in Core claims or eligibility.
    config:
      alias: dim_data_source
    columns:
      - name: data_source_sk
        description: Deterministic surrogate key for the data source.
        data_tests: [not_null, unique]
      - name: data_source
        description: User-defined source-system identifier.
        data_tests: [not_null, unique]

  - name: semantic_layer__dim_date
    description: Calendar dates spanning the minimum through maximum medical-claim start date.
    config:
      alias: dim_date
    columns:
      - name: full_date
        description: Calendar date.
        data_tests: [not_null, unique]

  - name: semantic_layer__dim_encounter_group
    description: Stable semantic keys for Tuva encounter groups.
    config:
      alias: dim_encounter_group
    columns:
      - name: encounter_group_sk
        description: Immutable semantic key for the encounter group.
        data_tests: [not_null, unique]
      - name: encounter_group
        description: Tuva encounter-group label.
        data_tests: [not_null, unique]

  - name: semantic_layer__dim_encounter_provider
    description: Highest-paid rendering provider for each source-scoped encounter, with deterministic tie breaking.
    config:
      alias: dim_encounter_provider
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [encounter_id, data_source]
    columns:
      - name: encounter_id
        description: Core encounter identifier.
        data_tests: [not_null]
      - name: data_source
        description: Source-system identifier for the encounter.
        data_tests: [not_null]
      - name: pqi_flag
        description: Integer indicator that the encounter meets an AHRQ PQI definition.
        config:
          meta:
            data_type: integer

  - name: semantic_layer__dim_encounter_type
    description: Stable semantic keys and group mappings for Tuva encounter types.
    config:
      alias: dim_encounter_type
    columns:
      - name: encounter_type_sk
        description: Immutable semantic key for the encounter type.
        data_tests: [not_null, unique]
      - name: encounter_type
        description: Tuva encounter-type label.
        data_tests: [not_null, unique]
      - name: encounter_group_sk
        description: Parent encounter-group key.
        data_tests:
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_encounter_group')
                field: encounter_group_sk

  - name: semantic_layer__dim_member
    description: Current member attributes at person and data-source grain.
    config:
      alias: dim_member
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, data_source]
    columns:
      - name: person_sk
        description: Compatibility key formed from person ID and data source.
        data_tests: [not_null, unique]

  - name: semantic_layer__dim_member_months
    description: Member and attribution attributes at Core's full member-month coverage grain.
    config:
      alias: dim_member_months
    columns:
      - name: member_month_id
        description: Authoritative Core member-month identifier.
        data_tests: [not_null, unique]
      - name: member_month_sk
        description: Deprecated compatibility key formed only from person ID and year-month; it is not guaranteed unique.

  - name: semantic_layer__dim_service_category
    description: One row per Tuva service-category hierarchy combination.
    config:
      alias: dim_service_category
    columns:
      - name: service_category_sk
        description: Deterministic key for the three-level service-category combination.
        data_tests: [not_null, unique]

  - name: semantic_layer__fact_admissions
    description: Claim-derived inpatient admission, readmission, and AHRQ PQI classifications at encounter and PQI grain.
    config:
      alias: fact_admissions
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [encounter_id, data_source, pqi_number]
    columns:
      - name: encounter_id
        description: Core encounter identifier.
        data_tests: [not_null]
      - name: data_source
        description: Source-system identifier for the encounter.
        data_tests: [not_null]

  - name: semantic_layer__fact_claims
    description: >-
      Enrolled medical claim lines enriched with encounter, provider, and
      service-category attributes, plus CCSR attributes for ICD-10-CM primary
      diagnoses.
    config:
      alias: fact_claims
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [medical_claim_id, data_source]
    columns:
      - name: medical_claim_id
        description: Core medical-claim line identifier.
        data_tests: [not_null]
      - name: primary_diagnosis_code_type
        description: Code system for the encounter's primary diagnosis.
      - name: member_month_id
        description: Authoritative Core member-month identifier when enrollment is available.
        data_tests:
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_member_months')
                field: member_month_id
      - name: service_category_sk
        description: Service-category dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_service_category')
                field: service_category_sk

  - name: semantic_layer__fact_ed_visits
    description: Claim-derived emergency-department encounters enriched with NYU ED classification.
    config:
      alias: fact_ed_visits
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [encounter_id, data_source]

  - name: semantic_layer__fact_encounter_service_bridge
    description: Distinct source-scoped encounter to service-category relationships.
    config:
      alias: fact_encounter_service_bridge
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [encounter_id, data_source, service_category_sk]

  - name: semantic_layer__fact_encounters
    description: Claim-derived Core encounters enriched with stable semantic encounter keys.
    config:
      alias: fact_encounters
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [encounter_id, data_source]
    columns:
      - name: encounter_group_sk
        description: Encounter-group dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_encounter_group')
                field: encounter_group_sk
      - name: encounter_type_sk
        description: Encounter-type dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_encounter_type')
                field: encounter_type_sk

  - name: semantic_layer__fact_hcc_gaps
    description: HCC suspecting gaps at source, person, payer, model-version, and HCC grain.
    config:
      alias: fact_hcc_gaps
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, payer, data_source, model_version, hcc_code]
    columns:
      - name: data_source
        description: Source-system identifier that scopes the person and payer.
        data_tests: [not_null]

  - name: semantic_layer__fact_member_months
    description: Cost and monthly CMS-HCC risk attributes at Core's full member-month coverage grain.
    config:
      alias: fact_member_months
    columns:
      - name: member_month_id
        description: Authoritative Core member-month identifier.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_member_months')
                field: member_month_id
      - name: member_month_sk
        description: Deprecated compatibility key formed only from person ID and year-month; it is not guaranteed unique.
      - name: population_normalized_risk_score
        description: >-
          Member risk score divided by the average risk score for the same
          year-month and data source.

  - name: semantic_layer__fact_pharmacy_claims
    description: |-
      Core pharmacy claim lines enriched with prescribing-provider specialty and
      CodeRx medication terminology. The model reads Tuva Core's canonical CodeRx
      package, drug, and class routers, so `use_coderx_enterprise` controls whether
      enrichment comes from the bundled CodeRx Open assets or user-managed CodeRx
      relations. The routers preserve one row per NDC11 and one selected ATC class
      per RxNorm drug concept, protecting the pharmacy-claim grain.

      CodeRx Open does not provide ingredient semantics. `ingredient_name` remains
      in the output contract as a typed null rather than inferring an ingredient
      from a drug or clinical-drug name.
    config:
      alias: fact_pharmacy_claims
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pharmacy_claim_id, data_source]
    columns:
      - name: pharmacy_claim_id
        description: Core pharmacy-claim line identifier.
        data_tests: [not_null]
      - name: member_month_id
        description: Authoritative Core member-month identifier when enrollment is available.
        data_tests:
          - relationships:
              arguments:
                to: ref('semantic_layer__dim_member_months')
                field: member_month_id
      - name: ndc_description
        description: CodeRx package drug name associated with ndc_code.
      - name: rxcui
        description: RxNorm drug concept identifier associated with the matched CodeRx package.
      - name: rxnorm_description
        description: CodeRx drug name associated with rxcui.
      - name: brand_name
        description: CodeRx drug name when the matched drug is branded; otherwise null.
      - name: brand_vs_generic
        description: Brand or generic classification derived from the CodeRx is_brand flag.
        data_tests:
          - accepted_values:
              arguments:
                values: [brand, generic]
      - name: ingredient_name
        description: |-
          Reserved compatibility column. Always null because the canonical CodeRx
          Open contract does not provide ingredient semantics.
      - name: atc_1_name
        description: ATC level 1 anatomical main-group name from the selected CodeRx class.
      - name: atc_2_name
        description: ATC level 2 therapeutic-subgroup name from the selected CodeRx class.
      - name: atc_3_name
        description: ATC level 3 therapeutic or pharmacological subgroup name from the selected CodeRx class.
      - name: atc_4_name
        description: ATC level 4 chemical, therapeutic, or pharmacological subgroup name from the selected CodeRx class.

  - name: semantic_layer__fact_quality_measures
    description: Source-scoped person-level quality-measure results by performance period.
    config:
      alias: fact_quality_measures
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - data_source
              - measure_id
              - measure_version
              - performance_period_begin
              - performance_period_end
    columns:
      - name: data_source
        description: Source-system identifier that scopes the person.
        data_tests: [not_null]

  - name: semantic_layer__fact_risk_factors
    description: CMS-HCC risk factors and coefficients by source, person, payer, model, and payment year.
    config:
      alias: fact_risk_factors
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - payer
              - data_source
              - factor_type
              - risk_factor_description
              - model_version
              - payment_year
    columns:
      - name: data_source
        description: Source-system identifier that scopes the person and payer.
        data_tests: [not_null]

  - name: semantic_layer__fact_risk_scores
    description: CMS-HCC risk scores by source, person, payer, and payment year.
    config:
      alias: fact_risk_scores
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [person_id, payer, data_source, payment_year]
    columns:
      - name: data_source
        description: Source-system identifier that scopes the person and payer.
        data_tests: [not_null]
